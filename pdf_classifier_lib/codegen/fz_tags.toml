# FzBinding tag table for MuPDF types. Read by gen_fz_wrappers.py.
#
# Rule: Document if the struct holds fz_document*, fz_page* or pdf_document*, directly or through any
# object it holds a reference to (including subclasses a base pointer can point at). Otherwise Context.
# Evidence paths are relative to the MuPDF source root (examples/build/mupdf_build/_deps/mupdf-src).
# 'contains' is checked by the generator, so drift after a MuPDF bump is reported.
#
# [uncertain.*] types stay untagged: using them fails to compile until someone decides and moves them.
# [skip.*] drop functions have the standard shape but don't drop an object handle; no wrapper is made.

mupdf_version = "1.26.12"

